services:
  - type: web
    name: alwaysdata            # nome do serviço existente, mantido
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ADMIN_API_KEY
        sync: false
      - key: GH_WORKFLOW_FILE
        value: process.yml
      - key: GH_WORKFLOW_REF
        value: main
      - key: GH_ACCOUNT_1_OWNER
        sync: false
      - key: GH_ACCOUNT_1_REPO
        sync: false
      # autenticação da conta 1: GitHub App (APP_ID, INSTALLATION_ID, PRIVATE_KEY) ou PAT (TOKEN)
      - key: GH_ACCOUNT_1_TOKEN
        sync: false
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: alwaysdata
          property: host
